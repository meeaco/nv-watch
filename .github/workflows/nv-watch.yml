name: NV watch digest

on:
  schedule:
    # 03:40 UTC daily: after arXiv's 00:00 UTC announcement, before the 05:50 UTC Claude routine
    - cron: "40 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
defaults:
  run:
     working-directory: nv-watch
concurrency:
  group: nv-watch
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build digest
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}        # optional
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}  # optional
        run: python scripts/nv_watch.py
      - name: Commit digest
        run: |
          git config user.name "nv-watch-bot"
          git config user.email "nv-watch-bot@users.noreply.github.com"
          git add digests state
          git diff --cached --quiet || git commit -m "digest $(date -u +%F)"
          git push
