name: NV watch digest

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nv-watch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build digest
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/nv_watch.py
      - name: Commit digest
        run: |
          git config user.name "nv-watch-bot"
          git config user.email "nv-watch-bot@users.noreply.github.com"
          git add digests state
          git diff --cached --quiet || git commit -m "digest $(date -u +%F)"
          git push
