name: NV watch digest

on:
  schedule:
    # GitHub's scheduler has been starting this job 4-6 h late (03:40 cron -> 08:20-09:20 UTC).
    # Three staggered runs (off the top of the hour) make it likely that one lands before the
    # 07:50 Europe/Madrid Claude routine. Same-day re-runs are cheap: seen.json prevents repeats
    # and the script merges the day's items into one digest.
    # arXiv announces at 00:00 UTC (EDT) / 01:00 UTC (EST), Sun-Thu evenings US time.
    - cron: "17 1 * * *"
    - cron: "47 2 * * *"
    - cron: "23 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nv-watch
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: nv-watch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build digest
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}        # optional, Crossref/OpenAlex polite pool
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}  # optional
          S2_API_KEY: ${{ secrets.S2_API_KEY }}              # optional, Semantic Scholar
        run: python scripts/nv_watch.py
      - name: Commit digest
        run: |
          git config user.name "nv-watch-bot"
          git config user.email "nv-watch-bot@users.noreply.github.com"
          git add digests state
          git diff --cached --quiet && exit 0
          git commit -m "digest $(date -u +%F) $(date -u +%H:%M)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 10; done
          exit 1
